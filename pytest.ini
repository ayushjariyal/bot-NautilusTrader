[pytest]
# Where pytest looks for tests.
testpaths = tests

# Lets tests import project packages (config, strategies, ...) from the project root.
pythonpath = .

# Integration tests talk to the real Bybit Testnet. They are skipped by default and
# run only when asked for explicitly:  pytest -m integration
markers =
    integration: needs a network connection to Bybit Testnet
addopts = -m "not integration"

# Hide ONE known, harmless warning raised inside NautilusTrader 1.231.0 with pandas 3.x
# (documented in README "Known issues"), so that any NEW warning stands out.
filterwarnings =
    ignore:Timestamp.utcnow is deprecated
    ignore:coroutine 'BybitExecutionClient._process_repayment_queues' was never awaited:RuntimeWarning
